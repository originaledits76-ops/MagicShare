name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. Install Gradle CLI on the runner
      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3

      # 2. Automatically generate the gradlew script if it's missing in your repo
      - name: Generate Gradle Wrapper If Missing
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi

      # 3. Make the wrapper executable
      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      # 4. Build the Debug APK
      - name: Build Native Android Debug APK
        run: ./gradlew assembleDebug

      # 5. Upload the Debug APK artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
