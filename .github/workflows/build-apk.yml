name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. Setup Gradle and force a stable, compatible version (Gradle 8.7) to avoid Gradle 10 incompatibility issues
      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 2. Automatically generate the gradlew script if it's missing
      - name: Generate Gradle Wrapper If Missing
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      # 3. Build the Debug APK while bypassing strict validation checks if needed
      - name: Build Native Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 4. Upload the Debug APK artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
